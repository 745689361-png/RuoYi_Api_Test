name: RuoYi API Test

on:
  push:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest

    env:
      RUOYI_USERNAME: ${{ secrets.RUOYI_USERNAME }}
      RUOYI_PASSWORD: ${{ secrets.RUOYI_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: |
          python -c "import os; print('USERNAME:', bool(os.getenv('RUOYI_USERNAME'))); import data.login_data; print('login_data import OK')"
          python -m pytest --env=local