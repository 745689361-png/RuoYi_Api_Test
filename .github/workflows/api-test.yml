name: RuoYi API Test

on:
  push:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest

    env:
      ROUYI_USERNAME: ${{ secrets.ROUYI_USERNAME }}
      ROUYI_PASSWORD: ${{ secrets.ROUYI_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          python -c "import os; print('USERNAME exists:', bool(os.getenv('ROUYI_USERNAME'))); print('PASSWORD exists:', bool(os.getenv('ROUYI_PASSWORD')))"

      - name: Run API tests
        run: |
          python -c "import os; print('pytest USERNAME:', bool(os.getenv('ROUYI_USERNAME')))"
          python -c "import os; print('pytest PASSWORD:', bool(os.getenv('ROUYI_PASSWORD')))"
          pytest --env=local