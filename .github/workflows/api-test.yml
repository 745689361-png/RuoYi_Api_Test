name: RuoYi API Test

on:
  push:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        env:
          ROUYI_USERNAME: ${{ secrets.ROUYI_USERNAME }}
          ROUYI_PASSWORD: ${{ secrets.ROUYI_PASSWORD }}
        run: pytest --env=local